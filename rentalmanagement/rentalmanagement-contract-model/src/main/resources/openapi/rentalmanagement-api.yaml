openapi: 3.1.0
info:
  title: Rental Management API
  version: 0.2.0
  description: |
    Phase 1 (Foundation) slice of the Rental Management modular monolith:
    identity (Keycloak-backed), properties, tenancies, and tenants.

    ## Authentication & Session Semantics (A)
    - **Browser UI**: Authenticates via OIDC authorization code flow + PKCE (S256).
      Upon successful authentication, Spring Security establishes a secure server-side session (`JSESSIONID`).
      Session cookies must be `HttpOnly`, `SameSite=Lax`, and `Secure`.
      Browser requests navigating to HTML views redirect to Keycloak if unauthenticated.
      Browser API/XHR/fetch requests returning 401 receive an RFC 9457 `application/problem+json` response (never an HTML redirect).
      Mutating operations authenticated via cookie require a valid CSRF token (`X-XSRF-TOKEN`).
    - **Programmatic Clients**: Bearer JWT tokens passed in the `Authorization: Bearer <token>` header,
      validated statelessly as an OAuth2 Resource Server. CSRF validation is disabled for Bearer requests.

    ## Roles & Identity (B)
    - Roles: `ADMIN`, `LANDLORD`, `FAMILY_VIEWER`, `ACCOUNTANT`.
    - Each user has exactly **one** primary application role, resolved from `realm_access.roles` by priority:
      `ADMIN` > `LANDLORD` > `ACCOUNTANT` > `FAMILY_VIEWER`.
    - Durable external identity is anchored on `(idpIssuer, idpSubject)` in persistence. These values are not exposed in the API.

    ## Tenancy Overlap Business Rule (E)
    - Each `Property` record represents an **independent single letting unit**.
    - For HMO properties in Phase 1, the property represents the entire dwelling let under a single agreement.
    - No two non-ended tenancies (DRAFT, ACTIVE, NOTICE) of the same property may have overlapping date ranges. An open-ended tenancy (null endDate) is treated as running indefinitely.
    - Concurrency protection on tenancy overlap must be enforced at the database level (PostgreSQL GiST exclusion constraint on `daterange`).
    - CHECK (end_date IS NULL OR end_date >= start_date) in the migration. State in the endDate descriptions that endDate must be on or after startDate.

    ## Mutation & Concurrency Conventions (C & D)
    - `PUT` requests represent a **full replacement** of mutable fields.
      Omitted optional fields or explicit `null` values clear the existing stored value.
    - Updates and deletes require optimistic locking via a `version` field.
      Concurrent edits returning mismatched versions result in an RFC 9457 `409 Conflict`.

    ## Conventions
    - Money is a decimal string mapped to NUMERIC(12,2) — never floating point.
    - Errors use RFC 9457 application/problem+json.
    - Every mutating operation writes an audit_event via the shared auditing module.
servers:
  - url: https://rental.homelab.internal/api
    description: K3s Traefik ingress (private LAN / Tailscale only)
tags:
  - name: Identity
  - name: Properties
  - name: Tenancies
  - name: Tenants
security:
  - keycloakOAuth: [ ]
  - bearerAuth: [ ]
  - sessionCookieAuth: [ ]
paths:
  /me:
    get:
      tags: [ Identity ]
      summary: Current authenticated user
      description: Returns the locally synced app_user snapshot for the caller (upserted on
        first login from the Keycloak sub, preferred_username, name, email and roles).
      operationId: getCurrentUser
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users:
    get:
      tags: [ Identity ]
      summary: List synced users (ADMIN only)
      description: Read-only view of the app_user snapshot. Creating, disabling and role
        changes happen in Keycloak; the local row is refreshed on next login.
      operationId: listUsers
      parameters:
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: active
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/UserSort'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOfUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/ValidationError'

  /properties:
    get:
      tags: [ Properties ]
      summary: List properties
      operationId: listProperties
      parameters:
        - name: q
          in: query
          description: Free-text match on reference, name and address lines (pg_trgm-backed).
          schema:
            type: string
        - name: propertyType
          in: query
          schema:
            $ref: '#/components/schemas/PropertyType'
        - name: active
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/PropertySort'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOfProperty'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [ Properties ]
      summary: Create property
      description: Roles ADMIN, LANDLORD. propertyReference must be unique.
      operationId: createProperty
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyInput'
      responses:
        '201':
          description: Created. Location header points at the new resource.
          headers:
            Location:
              description: URL of the created property.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /properties/{propertyId}:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
    get:
      tags: [ Properties ]
      summary: Get property
      operationId: getProperty
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [ Properties ]
      summary: Update property
      description: Roles ADMIN, LANDLORD. Full update; propertyReference is immutable.
      operationId: updateProperty
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyUpdateInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [ Properties ]
      summary: Deactivate property
      description: Roles ADMIN, LANDLORD. Soft delete — sets active=false and records an
        audit event. Rejected while the property still has non-ended tenancies.
      operationId: deleteProperty
      parameters:
        - $ref: '#/components/parameters/VersionQueryParam'
      responses:
        '204':
          description: Deactivated.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '400':
          $ref: '#/components/responses/ValidationError'

  /properties/{propertyId}/tenancies:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
    get:
      tags: [ Tenancies ]
      summary: List tenancies for a property
      operationId: listTenanciesForProperty
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TenancyStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/TenancySort'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOfTenancy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [ Tenancies ]
      summary: Create tenancy for a property
      description: Roles ADMIN, LANDLORD. The server rejects overlapping non-ended tenancies
        for the same property.
      operationId: createTenancy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenancyInput'
      responses:
        '201':
          description: Created. Location header points at the new tenancy.
          headers:
            Location:
              description: URL of the created tenancy.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenancyResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tenancies/{tenancyId}:
    parameters:
      - $ref: '#/components/parameters/TenancyId'
    get:
      tags: [ Tenancies ]
      summary: Get tenancy
      operationId: getTenancy
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenancyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [ Tenancies ]
      summary: Update tenancy
      description: Roles ADMIN, LANDLORD. Status changes are validated against the allowed
        transitions and audited. endDate must be set when transitioning to ENDED.
      operationId: updateTenancy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenancyUpdateInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenancyResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [ Tenancies ]
      summary: Delete tenancy
      description: Roles ADMIN, LANDLORD. Only possible while the tenancy is DRAFT or
        CANCELLED; otherwise the tenancy is historical and must be ended via PUT.
      operationId: deleteTenancy
      parameters:
        - $ref: '#/components/parameters/VersionQueryParam'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '400':
          $ref: '#/components/responses/ValidationError'

  /tenancies/{tenancyId}/tenants:
    parameters:
      - $ref: '#/components/parameters/TenancyId'
    get:
      tags: [ Tenants ]
      summary: List tenants on a tenancy
      operationId: listTenants
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/TenantSort'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOfTenant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [ Tenants ]
      summary: Add tenant to a tenancy
      description: Roles ADMIN, LANDLORD. Rejected when the tenancy is ENDED or CANCELLED.
      operationId: addTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantInput'
      responses:
        '201':
          description: Created.
          headers:
            Location:
              description: URL of the created tenant.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tenancies/{tenancyId}/tenants/{tenantId}:
    parameters:
      - $ref: '#/components/parameters/TenancyId'
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [ Tenants ]
      summary: Get tenant
      operationId: getTenant
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [ Tenants ]
      summary: Update tenant
      description: Roles ADMIN, LANDLORD. Set moveOutDate here when a tenant leaves rather
        than deleting the record.
      operationId: updateTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdateInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
           $ref: '#/components/responses/Conflict'
    delete:
      tags: [ Tenants ]
      summary: Remove tenant
      description: Roles ADMIN, LANDLORD. Rejected when the tenancy is ENDED or CANCELLED —
        prefer PUT with moveOutDate to preserve history.
      operationId: removeTenant
      parameters:
        - $ref: '#/components/parameters/VersionQueryParam'
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '400':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    sessionCookieAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: |
        Browser session cookie established post-OIDC authentication.
        Mutating requests require CSRF token passed via `X-XSRF-TOKEN` header.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak JWT access token with audience `rental-api`.
    keycloakOAuth:
      type: oauth2
      description: OIDC authorization code flow with mandatory PKCE (S256).
      flows:
        authorizationCode:
          authorizationUrl: https://auth.homelab.internal/realms/rental/protocol/openid-connect/auth
          tokenUrl: https://auth.homelab.internal/realms/rental/protocol/openid-connect/token
          scopes:
            openid: Authenticate user
            profile: User profile claims
            email: Email claims
  parameters:
    Page:
      name: page
      in: query
      description: Zero-based page index.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Number of records per page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    VersionQueryParam:
      name: version
      in: query
      required: true
      description: Expected resource version for safe optimistic-locked deletion.
      schema:
        $ref: '#/components/schemas/ResourceVersion'
    PropertySort:
      name: sort
      in: query
      description: Single sort field. Tie-breaker `id,asc` is always applied server-side.
      schema:
        type: string
        default: 'createdAt,desc'
        enum:
          - 'propertyReference,asc'
          - 'propertyReference,desc'
          - 'propertyName,asc'
          - 'propertyName,desc'
          - 'createdAt,asc'
          - 'createdAt,desc'
          - 'updatedAt,asc'
          - 'updatedAt,desc'
    TenancySort:
      name: sort
      in: query
      description: Single sort field. Tie-breaker `id,asc` is always applied server-side.
      schema:
        type: string
        default: 'startDate,desc'
        enum:
          - 'startDate,asc'
          - 'startDate,desc'
          - 'endDate,asc'
          - 'endDate,desc'
          - 'monthlyRent,asc'
          - 'monthlyRent,desc'
          - 'createdAt,asc'
          - 'createdAt,desc'
    TenantSort:
      name: sort
      in: query
      description: Single sort field. Tie-breaker `id,asc` is always applied server-side.
      schema:
        type: string
        default: 'createdAt,desc'
        enum:
          - 'fullName,asc'
          - 'fullName,desc'
          - 'moveInDate,asc'
          - 'moveInDate,desc'
          - 'createdAt,asc'
          - 'createdAt,desc'
    UserSort:
      name: sort
      in: query
      description: Single sort field. Tie-breaker `id,asc` is always applied server-side.
      schema:
        type: string
        default: 'createdAt,desc'
        enum:
          - 'username,asc'
          - 'username,desc'
          - 'displayName,asc'
          - 'displayName,desc'
          - 'createdAt,asc'
          - 'createdAt,desc'
    PropertyId:
      name: propertyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TenancyId:
      name: tenancyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Not authenticated.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Role insufficient for this operation, or CSRF token missing/invalid on a cookie-authenticated mutation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Request body or parameters failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: |
        Business-rule conflict (duplicate reference, overlapping tenancy, invalid status
        transition, non-empty delete) or stale `version` (optimistic-lock failure).
        Clients distinguish cases via `Problem.type`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ResourceVersion:
      type: integer
      format: int64
      minimum: 0
      description: Optimistic lock version counter. Incremented on every mutation.
      example: 1

    Money:
      type: string
      pattern: '^\d{1,10}(\.\d{2})?$'
      description: Decimal amount as a string, persisted as NUMERIC(12,2).
      example: '1450.00'

    NullableMoney:
      description: Decimal monetary amount or explicit null.
      anyOf:
        - $ref: '#/components/schemas/Money'
        - type: 'null'
    UserRole:
      type: string
      enum: [ ADMIN, LANDLORD, FAMILY_VIEWER, ACCOUNTANT ]
    PropertyType:
      type: string
      enum: [ TERRACED, SEMI_DETACHED, DETACHED, FLAT, MAISONETTE, BUNGALOW, HMO, OTHER ]
    TenancyStatus:
      type: string
      enum: [ DRAFT, ACTIVE, NOTICE, ENDED, CANCELLED ]
      description: |
        Allowed transitions (validated server-side and audited):
        DRAFT -> ACTIVE | CANCELLED
        ACTIVE -> NOTICE | ENDED
        NOTICE -> ENDED
        ENDED and CANCELLED are terminal.
    UserResponse:
      type: object
      required: [ id, username, displayName, role, active, createdAt, updatedAt ]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          maxLength: 100
        displayName:
          type: string
          maxLength: 200
        email:
          type: [ string, 'null' ]
          format: email
          maxLength: 320
        role:
          $ref: '#/components/schemas/UserRole'
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PageOfUser:
      type: object
      required: [ content, totalElements, totalPages, page, size ]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        page:
          type: integer
          description: Zero-based page index.
        size:
          type: integer
    PropertyInput:
      type: object
      additionalProperties: false
      required: [ propertyReference, addressLine1, postcode ]
      properties:
        propertyReference:
          type: string
          maxLength: 50
          example: 'PROP-001'
        propertyName:
          type: [ string, 'null' ]
          maxLength: 200
        addressLine1:
          type: string
          maxLength: 200
        addressLine2:
          type: [ string, 'null' ]
          maxLength: 200
        town:
          type: [ string, 'null' ]
          maxLength: 100
        county:
          type: [ string, 'null' ]
          maxLength: 100
        postcode:
          type: string
          maxLength: 12
          example: 'SW1A 1AA'
        propertyType:
          anyOf:
            - $ref: '#/components/schemas/PropertyType'
            - type: 'null'
        purchaseDate:
          type: [ string, 'null' ]
          format: date
        purchasePrice:
          $ref: '#/components/schemas/NullableMoney'
        ownershipPercentage:
          type: number
          exclusiveMinimum: 0
          maximum: 100
          default: 100
        notes:
          type: [ string, 'null' ]

    PropertyUpdateInput:
        type: object
        additionalProperties: false
        description: |
          Full update. Required fields must not be null.
          Omission or explicit null for optional fields clears their stored value.
        required: [ addressLine1, postcode, ownershipPercentage, version ]
        properties:
          version:
            $ref: '#/components/schemas/ResourceVersion'
          propertyName:
            type: [ string, 'null' ]
            maxLength: 200
          addressLine1:
            type: string
            maxLength: 200
          addressLine2:
            type: [ string, 'null' ]
            maxLength: 200
          town:
            type: [ string, 'null' ]
            maxLength: 100
          county:
            type: [ string, 'null' ]
            maxLength: 100
          postcode:
            type: string
            maxLength: 12
          propertyType:
            anyOf:
              - $ref: '#/components/schemas/PropertyType'
              - type: 'null'
          purchaseDate:
            type: [ string, 'null' ]
            format: date
          purchasePrice:
            $ref: '#/components/schemas/NullableMoney'
          ownershipPercentage:
            type: number
            exclusiveMinimum: 0
            maximum: 100
          notes:
            type: [ string, 'null' ]

    PropertyResponse:
        type: object
        required: [ id, propertyReference, addressLine1, postcode, ownershipPercentage, active, version, createdAt, updatedAt ]
        properties:
          id:
            type: string
            format: uuid
          version:
            $ref: '#/components/schemas/ResourceVersion'
          propertyReference:
            type: string
          propertyName:
            type: [ string, 'null' ]
          addressLine1:
            type: string
          addressLine2:
            type: [ string, 'null' ]
          town:
            type: [ string, 'null' ]
          county:
            type: [ string, 'null' ]
          postcode:
            type: string
          propertyType:
            anyOf:
              - $ref: '#/components/schemas/PropertyType'
              - type: 'null'
          purchaseDate:
            type: [ string, 'null' ]
            format: date
          purchasePrice:
            $ref: '#/components/schemas/NullableMoney'
